name: Verify AuditOS Gap Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Verify syntax and contracts
        run: npm run verify
      - name: Build Vercel output
        run: npm run build
      - name: Verify isolated output
        run: |
          test -f .vercel-static/index.html
          test -f .vercel-static/app.js
          test -f .vercel-static/styles.css
          test -f .vercel-static/core/mapper.js
          test -f .vercel-static/browser/parsers.js
          test ! -e .vercel-static/tests
          ! grep -RniE 'supabase|sign[ -]?in|login' .vercel-static
